<!DOCTYPE html>
<html>
    <head>
        <title>Kinetiq Quest!</title>
        <style>
            body{
                margin: 0;
                min-height: 100vh;
                background: #f5f1e8;
                color: #171717;
                font-family: Georgia, "Times New Roman", serif;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .page{
                width: min(1100px, 100%);
                min-height: 720px;
                border: 2px solid #222;
                background: #faf8f1;
                position: relative;
                padding: 58px 70px 80px;
                box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
            }
            h1{
                margin: 0;
                text-align: center;
                font-size: clamp(2.3rem, 5vw, 4.5rem);
                font-weight: 400;
                letter-spacing: 0.02em;
            }
            .content{
                min-height: 560px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 80px;
            }
            .login-label{
                font-size: 1.35rem;
                white-space: nowrap;
            }
            .login-card{
                width: min(360px, 100%);
                display: flex;
                flex-direction: column;
                gap: 24px;
            }
            .field{
                width: 100%;
                height: 58px;
                border: 2px solid #222;
                border-radius: 5px;
                padding: 0 16px;
            }
        </style>
    </head>
    <body>
        <h1>Log in here </h1>
        <p>If you already have an account, please <a href="signin.html">sign in</a>.</p>
        <p>If you don't have an account, please <a href="signup.html">sign up</a>.</p>
    </body>
</html>
