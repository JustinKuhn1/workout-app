<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetiq Quest</title>
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="page">
        <!-- Title -->
        <h1>Welcome to Kinetiq Quest!</h1>

        <!-- Login -->
        <section class="login-section">
            <!-- Top Text -->
            <div class="login-label">
                Log in here to start your fitness journey!
            </div>

            <!-- Login Boxes -->
            <form class="login-card" id="loginForm">
                <!-- Username -->
                <!-- CHANGED: removed "required" so logging in doesn't demand a username (login uses email + password).
                     The username is only enforced when creating an account (see the script below). -->
                <input class="field" type="text" id="username" name="username" placeholder="username (sign up only):"
                    autocomplete="username">
                <!-- Email -->
                <input class="field" type="email" id="email" name="email" placeholder="email:" autocomplete="email"
                    required>
                <!-- Password -->
                <input class="field" type="password" id="password" name="password" placeholder="password:"
                    autocomplete="current-password" required>
                <!-- Login Button -->
                <button type="submit">
                    Log In
                </button>
                <div class="message" id="message" aria-live="polite">
                </div>
            </form>
            <!-- Create Account(Text) -->
            <a href="#" class="create-account" id="createAccount">
                Create an account
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        // CHANGED: was getElementById("login-card") - that's a class, the form's id is "loginForm", so form was null and the script crashed.
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        //Returning users will go to their dashboard and new users go to the questionnaire.
        async function goToNextPage(userId) {
            const { data, error } = await db.from("profiles").select("plan").eq("id", userId).maybeSingle();
            // CHANGED: errors were silently ignored, so a missing table/bad policy just looked like "new user".
            // Now they show in the browser console (F12) while still falling back to onboarding.
            if (error) console.error("Could not read profile:", error);
            window.location.href = data && data.plan ? "dashboard.html" : "onboarding.html";
        }

        //For signInWithPassword or "signUp". Both take the same email and password
        async function authenticate(method) {
            showError(message);
            const credentials = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
            };

            // CHANGED: save the username on the new account (Supabase user metadata) so it isn't thrown away.
            // Only done for sign up; no database/table changes needed.
            if (method === "signUp") {
                credentials.options = { data: { username: document.getElementById("username").value.trim() } };
            }

            try {
                const { data, error } = await db.auth[method](credentials);
                if (error) throw error;

                if (!data.session) {
                    // Happens when Supabase email confirmation is turned on.
                    showError(message, "Check your email to confirm your account, then log in.");
                    return;
                }
                await goToNextPage(data.user.id);
            } catch (err) {
                showError(message, err.message);
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            authenticate("signInWithPassword");
        });

        // CHANGED: was getElementById("signup-button"), which doesn't exist (null -> crash).
        // The sign up trigger is the "Create an account" link, so it's wired up here instead.
        document.getElementById("createAccount").addEventListener("click", (event) => {
            event.preventDefault(); // stop the "#" link from jumping to the top of the page
            if (!form.reportValidity()) return; // checks email + password
            // CHANGED: username is only required when signing up
            const username = document.getElementById("username");
            if (!username.value.trim()) {
                showError(message, "Please choose a username to create an account.");
                username.focus();
                return;
            }
            authenticate("signUp");
        });

        // Skip this page if the visitor is already logged in.
        db.auth.getSession().then(({ data }) => {
            if (data.session) goToNextPage(data.session.user.id);
        });

    </script>

</body>

</html>
