<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Details - Workout Planner</title>
  <!-- CHANGED: was "style.css", but the file is named styles.css -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- CHANGED: a way out of the questionnaire. Where it leads depends on whether this account
       already has a plan; the script below decides. It comes first in the page so it is also the
       first thing the Tab key reaches. -->
  <button type="button" class="page-close" id="close-button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12" />
      <path d="M18 6L6 18" />
    </svg>
  </button>

  <div class="page">
    <h1>Tell us about you</h1>

    <form id="questionnaire" class="card">
      <div class="field">
        <label for="goal">Goal</label>
        <select id="goal" name="goal" required>
          <option value="">Choose...</option>
          <option>Lose Fat</option>
          <option>Build Muscle</option>
          <option>Get Stronger</option>
          <option>General Fitness</option>
          <option>Improve Endurance</option>
        </select>
      </div>

      <div class="field">
        <label for="experience">Experience</label>
        <select id="experience" name="experience" required>
          <option value="">Choose...</option>
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Advanced</option>
        </select>
      </div>

      <div class="field">
        <label for="daysPerWeek">Days per week</label>
        <select id="daysPerWeek" name="daysPerWeek" required>
          <option value="">Choose...</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
        </select>
      </div>

      <div class="field">
        <label for="sessionMinutes">Minutes per session</label>
        <select id="sessionMinutes" name="sessionMinutes" required>
          <option value="">Choose...</option>
          <option>20</option>
          <option>30</option>
          <option>45</option>
          <option>60</option>
          <option>90</option>
        </select>
      </div>

      <div class="field checks">
        <label>Equipment</label>
        <label><input type="checkbox" name="equipment" value="bodyweight only" /> Bodyweight only</label>
        <label><input type="checkbox" name="equipment" value="dumbbells" /> Dumbbells</label>
        <label><input type="checkbox" name="equipment" value="full gym" /> Full gym</label>
        <label><input type="checkbox" name="equipment" value="resistance bands" /> Resistance bands</label>
      </div>

      <div class="field">
        <label for="injuries">Injuries (optional)</label>
        <textarea id="injuries" name="injuries" placeholder="e.g. sore left knee"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="10" max="100" />
        </div>
        <div class="field">
          <label for="heightFeet">Height (ft)</label>
          <input type="number" id="heightFeet" name="heightFeet" min="3" max="8" />
        </div>
        <div class="field">
          <label for="heightInches">Height (in)</label>
          <input type="number" id="heightInches" name="heightInches" min="0" max="11" />
        </div>
        <div class="field">
          <label for="weightLbs">Weight (lbs)</label>
          <input type="number" id="weightLbs" name="weightLbs" min="60" max="700" />
        </div>
      </div>

      <p class="error" id="error" hidden></p>
      <button type="submit" class="btn" id="submit-button">Generate my plan</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const form = document.getElementById("questionnaire");
    const errorEl = document.getElementById("error");
    const button = document.getElementById("submit-button");
    const closeButton = document.getElementById("close-button");

    // CHANGED: the profile is read once, up front. The close button needs to know whether a plan
    // already exists and "Edit Plan" needs the saved answers, so a single read covers both.
    const profileLoaded = loadProfile();

    async function loadProfile() {
      const session = await requireSession(); // redirects to the login page if not logged in
      if (!session) return null;

      const { data, error } = await db
        .from("profiles")
        .select("answers, plan")
        .eq("id", session.user.id)
        .maybeSingle();
      if (error) {
        console.error("Could not read profile:", error);
        return null;
      }
      return data;
    }

    // "Edit Plan" from the dashboard opens this page with ?edit=1: refill the form with the saved answers.
    if (new URLSearchParams(window.location.search).has("edit")) {
      document.querySelector("h1").textContent = "Edit your plan";
      button.textContent = "Update my plan";
      prefillForm();
    }

    async function prefillForm() {
      const profile = await profileLoaded;
      const saved = profile && profile.answers;
      if (!saved) return;

      for (const name of ["goal", "experience", "daysPerWeek", "sessionMinutes", "injuries", "age", "heightFeet", "heightInches", "weightLbs"]) {
        if (saved[name] !== null && saved[name] !== undefined) form.elements[name].value = saved[name];
      }
      for (const box of form.querySelectorAll('input[name="equipment"]')) {
        box.checked = (saved.equipment || []).includes(box.value);
      }
    }

    // CHANGED: closing goes back to wherever the user came from. With a plan saved they were editing it,
    // so the dashboard is still behind this page. Without one there is nothing to go back to, so they are
    // signed out on the way to the login screen: going there while still signed in would only bounce them
    // straight back here, since the login page sends an account with no plan to the questionnaire.
    closeButton.addEventListener("click", async () => {
      closeButton.disabled = true;
      const profile = await profileLoaded;
      if (profile && profile.plan) {
        window.location.href = "dashboard.html";
      } else {
        await logOut();
      }
    });

    // Turns the form fields into the answers object that is saved and sent to Gemini.
    function readAnswers() {
      const data = new FormData(form);
      // Age, height and weight are optional: an empty box becomes null (a real 0 is kept).
      const optionalNumber = (name) => (data.get(name) === "" ? null : Number(data.get(name)));

      return {
        goal: data.get("goal"),
        experience: data.get("experience"),
        daysPerWeek: Number(data.get("daysPerWeek")),
        sessionMinutes: Number(data.get("sessionMinutes")),
        equipment: data.getAll("equipment"),
        injuries: data.get("injuries").trim(),
        age: optionalNumber("age"),
        heightFeet: optionalNumber("heightFeet"),
        heightInches: optionalNumber("heightInches"),
        weightLbs: optionalNumber("weightLbs"),
      };
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showError(errorEl);

      const answers = readAnswers();
      if (answers.equipment.length === 0) {
        showError(errorEl, "Pick at least one type of equipment.");
        return;
      }

      // Disable the button so the plan can't be requested twice while Gemini is working.
      button.disabled = true;
      button.textContent = "Generating your plan (this can take a few seconds)...";

      try {
        const session = await requireSession();
        await generateAndSavePlan(session.user.id, answers);
        window.location.href = "dashboard.html";
      } catch (err) {
        console.error(err);
        showError(errorEl, "Something went wrong while creating your plan. Please try again.");
        button.disabled = false;
        button.textContent = "Try again";
      }
    });
  </script>
</body>
</html>
