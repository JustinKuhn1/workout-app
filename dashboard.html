<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Dashboard - Workout Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6.5 6.5v11" />
            <path d="M17.5 6.5v11" />
            <path d="M3.5 9v6" />
            <path d="M20.5 9v6" />
            <path d="M6.5 12h11" />
          </svg>
        </span>
        <span class="brand-name">Workout Planner</span>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-small btn-secondary" id="regenerate-button">Regenerate plan</button>
        <button type="button" class="btn btn-small btn-ghost" id="logout-button">Log out</button>
      </div>
    </div>
  </header>

  <main class="dash">
    <div class="dash-head">
      <h1>Your weekly plan</h1>
      <!-- CHANGED: "below" no longer fits now that logging lives in its own tab. -->
      <p>Today is highlighted. Use the Log a workout tab to track your progress.</p>
    </div>

    <p class="error" id="error" hidden></p>

    <!-- CHANGED: tabs. Styled through role / aria-selected so no new classes or ids are needed.
         Each tab and its panel share a data-tab value, and the script shows one panel at a time. -->
    <div role="tablist">
      <button type="button" role="tab" data-tab="plan" aria-selected="true">Weekly plan</button>
      <button type="button" role="tab" data-tab="tips" aria-selected="false" tabindex="-1">Tips</button>
      <button type="button" role="tab" data-tab="log" aria-selected="false" tabindex="-1">Log a workout</button>
      <button type="button" role="tab" data-tab="recent" aria-selected="false" tabindex="-1">Recent workouts</button>
    </div>

    <div role="tabpanel" data-tab="plan">
      <section class="card summary">
        <div class="summary-main">
          <h2>Overview</h2>
          <p id="summary"></p>
        </div>
      </section>

      <section class="days-section">
        <div class="section-head">
          <h2>This week</h2>
        </div>
        <div class="days" id="days"></div>
      </section>
    </div>

    <!-- CHANGED: tips moved out of the overview card into their own tab. -->
    <div role="tabpanel" data-tab="tips" hidden>
      <section class="card">
        <h2>Tips</h2>
        <ul id="tips"></ul>
      </section>
    </div>

    <!-- CHANGED: the log form moved into its own tab (the .split two-column wrapper is gone). -->
    <div role="tabpanel" data-tab="log" hidden>
      <section class="card">
        <h2>Log a workout</h2>
        <form id="log-form">
          <div class="field">
            <label for="exercise">Exercise</label>
            <!-- CHANGED: the datalist is replaced by the picker dialog at the bottom of the page.
                 autocomplete="off" stops the browser's own dropdown from showing on top of it. -->
            <input type="text" id="exercise" name="exercise" autocomplete="off" required />
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>
          <div class="row row-3">
            <div class="field">
              <label for="sets">Sets</label>
              <input type="number" id="sets" name="sets" min="1" />
            </div>
            <div class="field">
              <label for="reps">Reps</label>
              <input type="number" id="reps" name="reps" min="1" />
            </div>
            <div class="field">
              <label for="weight">Weight (lbs)</label>
              <input type="number" id="weight" name="weight" min="0" step="0.5" />
            </div>
          </div>
          <div class="field">
            <label for="notes">Notes</label>
            <input type="text" id="notes" name="notes" />
          </div>
          <button type="submit" class="btn">Add to log</button>
        </form>
      </section>
    </div>

    <!-- CHANGED: recent logs moved into their own tab; heading renamed to match the tab. -->
    <div role="tabpanel" data-tab="recent" hidden>
      <section class="card">
        <h2>Recent workouts</h2>
        <div id="logs"></div>
      </section>
    </div>
  </main>

  <!-- CHANGED: exercise picker. It opens when the user clicks or starts typing in the Exercise box.
       It reuses the .card, .btn and input styles, so no new classes or ids are needed.
       closedby="any" lets a click outside close it in browsers that support it; Esc and Cancel work everywhere. -->
  <dialog class="card" aria-label="Choose an exercise" closedby="any">
    <h2>Choose an exercise</h2>
    <input type="text" placeholder="Search exercises..." aria-label="Search exercises" autocomplete="off" />
    <ul></ul>
    <form method="dialog">
      <button class="btn btn-secondary">Cancel</button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const errorEl = document.getElementById("error");
    const logForm = document.getElementById("log-form");
    let userId;
    let answers; // the saved questionnaire answers, reused by "Regenerate plan"
    let exerciseNames = []; // CHANGED: every exercise in the plan, listed by the exercise picker

    // ---------- Page setup ----------

    // Runs an async action. If it fails, shows a friendly message instead of crashing.
    async function run(action, failMessage) {
      showError(errorEl);
      try {
        await action();
      } catch (err) {
        console.error(err);
        showError(errorEl, failMessage);
      }
    }

    // The date box starts on today. Setting defaultValue means form.reset() keeps it.
    document.getElementById("date").defaultValue = new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD

    document.getElementById("logout-button").addEventListener("click", logOut);

    run(async () => {
      const session = await requireSession();
      if (!session) return;
      userId = session.user.id;
      await showPlan();
      await showLogs();
    }, "Could not load your data. Please refresh the page.");

    // ---------- Weekly plan ----------

    async function showPlan() {
      const { data: profile, error } = await db
        .from("profiles")
        .select("answers, plan")
        .eq("id", userId)
        .maybeSingle();
      if (error) throw error;

      // No saved plan yet: send the user to the questionnaire.
      if (!profile || !profile.plan) {
        window.location.href = "onboarding.html";
        return;
      }

      answers = profile.answers;
      renderPlan(profile.plan);
    }

    function renderPlan(plan) {
      document.getElementById("summary").textContent = plan.summary;

      const tips = (plan.tips || []).map((tip) => el("li", "", tip));
      // CHANGED: Tips is its own tab now, so say so when the plan has none (the empty card used to just hide).
      if (tips.length === 0) tips.push(el("li", "muted", "No tips for this plan."));
      document.getElementById("tips").replaceChildren(...tips);

      const today = new Date().toLocaleDateString("en-US", { weekday: "long" });
      const days = plan.days.map((day) => renderDay(day, day.day.toLowerCase() === today.toLowerCase()));
      document.getElementById("days").replaceChildren(...days);

      // CHANGED: this used to fill a datalist. Now it just remembers the names for the exercise picker.
      exerciseNames = [...new Set(plan.days.flatMap((day) => day.exercises.map((exercise) => exercise.name)))];
    }

    function renderDay(day, isToday) {
      const card = el("div", isToday ? "day today" : "day");

      const title = el("h3", "", day.day);
      if (isToday) title.append(" ", el("span", "badge", "Today"));
      card.append(title, el("p", "muted", day.focus));

      for (const exercise of day.exercises) {
        const item = el("div", "exercise");
        item.append(el("strong", "", exercise.name), el("div", "muted", `${exercise.sets} sets x ${exercise.reps}`));
        if (exercise.notes) item.append(el("div", "muted", exercise.notes));
        card.append(item);
      }
      return card;
    }

    document.getElementById("regenerate-button").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      button.textContent = "Regenerating...";

      await run(async () => {
        await generateAndSavePlan(userId, answers);
        await showPlan();
      }, "Could not regenerate your plan. Please try again.");

      button.disabled = false;
      button.textContent = "Regenerate plan";
    });

    // ---------- Tabs ----------
    // CHANGED: new section. Shows one tab's panel at a time.

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];

    function showTab(name) {
      for (const tab of tabs) {
        const selected = tab.dataset.tab === name;
        tab.setAttribute("aria-selected", selected);
        tab.tabIndex = selected ? 0 : -1; // only the open tab is in the Tab key order
      }
      for (const panel of panels) panel.hidden = panel.dataset.tab !== name;
    }

    for (const tab of tabs) {
      tab.addEventListener("click", () => showTab(tab.dataset.tab));

      // Left / right arrows move between tabs, wrapping around at the ends.
      tab.addEventListener("keydown", (event) => {
        const step = { ArrowLeft: -1, ArrowRight: 1 }[event.key];
        if (!step) return;
        const next = tabs[(tabs.indexOf(tab) + step + tabs.length) % tabs.length];
        showTab(next.dataset.tab);
        next.focus();
      });
    }

    // ---------- Exercise picker ----------
    // CHANGED: new section. A dialog with a search bar that opens when the user clicks or types in the Exercise box.

    const exerciseInput = document.getElementById("exercise");
    const exerciseDialog = document.querySelector("dialog");
    const exerciseSearch = exerciseDialog.querySelector("input");
    const exerciseChoices = exerciseDialog.querySelector("ul");

    // Clicking starts with the full list. Typing carries what was typed into the search bar.
    exerciseInput.addEventListener("click", () => openExercisePicker(""));
    exerciseInput.addEventListener("input", () => openExercisePicker(exerciseInput.value));

    exerciseSearch.addEventListener("input", showExerciseChoices);
    exerciseSearch.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      exerciseChoices.querySelector("button")?.click(); // Enter picks the top result
    });

    function openExercisePicker(search) {
      exerciseSearch.value = search;
      showExerciseChoices();
      exerciseDialog.showModal(); // focuses the search bar; closing returns focus to the Exercise box
    }

    function showExerciseChoices() {
      const typed = exerciseSearch.value.trim();
      const query = typed.toLowerCase();
      const rows = exerciseNames
        .filter((name) => name.toLowerCase().includes(query))
        .map((name) => exerciseChoice(name, name));

      // Any exercise is allowed, not just the ones in the plan, so offer what was typed too.
      if (typed && !exerciseNames.some((name) => name.toLowerCase() === query)) {
        rows.push(exerciseChoice(`Use "${typed}"`, typed));
      }
      if (rows.length === 0) rows.push(el("li", "muted", "No exercises in your plan yet. Type a name to add your own."));
      exerciseChoices.replaceChildren(...rows);
    }

    // One row in the list. Clicking it fills in the Exercise box and closes the picker.
    function exerciseChoice(label, value) {
      const button = el("button", "btn btn-secondary", label);
      button.type = "button";
      button.addEventListener("click", () => {
        exerciseInput.value = value;
        exerciseDialog.close();
      });

      const item = el("li");
      item.append(button);
      return item;
    }

    // ---------- Workout log ----------

    logForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(logForm);

      run(async () => {
        const { error } = await db.from("workout_logs").insert({
          user_id: userId,
          logged_on: data.get("date"),
          exercise: data.get("exercise").trim(),
          sets: Number(data.get("sets")) || null,
          reps: Number(data.get("reps")) || null,
          weight: Number(data.get("weight")) || null,
          notes: data.get("notes").trim() || null,
        });
        if (error) throw error;

        logForm.reset();
        await showLogs();
        // CHANGED: the list is on another tab now, so jump to it. Otherwise saving would look like nothing happened.
        showTab("recent");
      }, "Could not save your workout. Please try again.");
    });

    async function showLogs() {
      // Row Level Security means this only ever returns the current user's logs.
      const { data: logs, error } = await db
        .from("workout_logs")
        .select("*")
        .order("logged_on", { ascending: false })
        .order("created_at", { ascending: false });
      if (error) throw error;

      const rows = logs.map(renderLog);
      if (rows.length === 0) rows.push(el("p", "muted", "No workouts logged yet."));
      document.getElementById("logs").replaceChildren(...rows);
    }

    function renderLog(log) {
      const details = [
        log.logged_on,
        log.sets ? `${log.sets} sets` : "",
        log.reps ? `${log.reps} reps` : "",
        log.weight ? `${log.weight} lbs` : "",
      ].filter(Boolean).join(" | ");

      const text = el("div");
      text.append(el("strong", "", log.exercise), el("div", "muted", details));
      if (log.notes) text.append(el("div", "muted", log.notes));

      const deleteButton = el("button", "btn btn-small btn-danger", "Delete");
      deleteButton.type = "button";
      deleteButton.addEventListener("click", () => {
        run(async () => {
          const { error } = await db.from("workout_logs").delete().eq("id", log.id);
          if (error) throw error;
          await showLogs();
        }, "Could not delete that log. Please try again.");
      });

      const row = el("div", "log");
      row.append(text, deleteButton);
      return row;
    }
  </script>
</body>
</html>
